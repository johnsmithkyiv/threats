name: Collect and Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Collection mode
        required: true
        default: recent
        type: choice
        options:
          - recent
          - backfill
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.dashboard.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect source posts
        env:
          COLLECTION_MODE: ${{ inputs.mode || 'backfill' }}
        run: npm run collect -- --$COLLECTION_MODE
      - run: npm test
      - id: dashboard
        name: Build dashboard data
        run: |
          npm run data
          data_changed=false
          if git diff --quiet -- public/data/kyiv-threats-dashboard.json; then
            data_changed=false
          else
            data_changed=true
          fi
          echo "data_changed=$data_changed" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$data_changed" = "true" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Save collected source posts
        run: |
          if git diff --quiet -- data/source-posts.json public/data/kyiv-threats-dashboard.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-posts.json public/data/kyiv-threats-dashboard.json
          git commit -m "Update collected threat reports"
          git push
      - run: npm run build
      - if: steps.dashboard.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.dashboard.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
