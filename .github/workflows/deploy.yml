name: Collect and Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Collection mode
        required: true
        default: recent
        type: choice
        options:
          - recent
          - backfill
  schedule:
    - cron: "7,27,47 * * * *"

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect source posts
        env:
          COLLECTION_MODE: ${{ inputs.mode || 'recent' }}
        run: npm run collect -- --$COLLECTION_MODE
      - name: Save collected source posts
        run: |
          if git diff --quiet -- data/source-posts.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-posts.json
          git commit -m "Update collected threat reports"
          git push
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
